## Environment-driven configuration for amavis.
##
## This file is loaded after the distribution's /etc/amavisd.conf and before
## /etc/amavisd-local.conf:
##
##   amavisd -c /etc/amavisd.conf -c /etc/amavisd-env.conf \
##           -c /etc/amavisd-local.conf foreground
##
## Later files win. An unset environment variable normally keeps the value
## from the distribution configuration; the container-specific overrides below
## are the documented exceptions.
##
## Env names are the variable name without the leading '$', uppercased.
## Boolean values accept 1/0, true/false, yes/no, on/off. Empty numeric and
## boolean values are treated as unset. Empty string values are treated as
## unset except where noted below.
##
## Each section states why the Alpine default is kept or changed. Settings
## that do not make sense to vary in this image are intentionally not exposed;
## they can still be overridden in /etc/amavisd-local.conf.

use strict;

## Some environment variables need untainting.

sub u {
	my($v) = @_;
	return undef if !defined $v;
	return ($v =~ /(.*)/s)[0];
}

sub env_str {
	my($name, $default) = @_;
	return u($ENV{$name}) if defined $ENV{$name} && $ENV{$name} ne '';
	return u($default);
}

sub env_num {
	my($name, $default) = @_;
	return $default if !defined $ENV{$name} || $ENV{$name} eq '';
	return 0 + u($ENV{$name});
}

sub env_bool {
	my($name, $default) = @_;
	return $default if !defined $ENV{$name} || $ENV{$name} eq '';
	my $v = lc u($ENV{$name});
	$v =~ s/^\s+//;
	$v =~ s/\s+$//;
	return 1 if $v =~ /^(?:1|true|yes|on)$/;
	return 0 if $v =~ /^(?:0|false|no|off)$/;
	return $default;
}

sub env_port {
	my($name, $default) = @_;
	my $port = env_num($name, $default);
	return $default if !defined $port || $port < 1 || $port > 65535;
	return int($port);
}

sub env_destiny {
	my($name, $default) = @_;
	my %destiny = (
		D_DISCARD => D_DISCARD,
		D_REJECT  => D_REJECT,
		D_PASS    => D_PASS,
	);
	my $v = u($ENV{$name});
	return $default if !defined $v || $v eq '';
	return exists $destiny{$v} ? $destiny{$v} : $default;
}

## GENERAL

## Alpine uses uname(3) for $myhostname, which is normally the short
## container hostname and is rejected by amavis as not being an FQDN. Prefer
## MYHOSTNAME, then hostname -f, then hostname.
if (defined $ENV{MYHOSTNAME} && $ENV{MYHOSTNAME} ne '') {
	chomp($myhostname = u($ENV{MYHOSTNAME}));
} else {
	chomp($myhostname = u(`hostname -f`));
	chomp($myhostname = u(`hostname`)) if $myhostname eq '';
}

## Alpine's $mydomain default is example.com; keep it unless MYDOMAIN is set.
## The distribution has already evaluated @local_domains_maps, so re-derive
## it when the domain changes.
if (defined $ENV{MYDOMAIN} && $ENV{MYDOMAIN} ne '') {
	chomp($mydomain = u($ENV{MYDOMAIN}));
	@local_domains_maps = ( [".$mydomain"] );
}

## Keep Alpine's max_servers=2 and upstream max_requests=20 defaults. These
## are useful for sizing the container.
$max_requests = env_num('MAX_REQUESTS', $max_requests);
$max_servers  = env_num('MAX_SERVERS',  $max_servers);

## Alpine enables syslog. The container has no /dev/log and logs are collected
## from stderr, so keep $do_syslog disabled. LOG_LEVEL is still useful for
## troubleshooting and is exposed. $syslog_facility is not exposed because it
## has no effect while syslog is off.
$do_syslog = 0;
$log_level = env_num('LOG_LEVEL', $log_level);

## Alpine enables the amavisd-release/milter unix socket at
## $MYHOME/amavisd.sock. This container uses SMTP/LMTP between containers, so
## the socket is unnecessary by default. Disable it and set UNIX_SOCKETNAME
## only when amavisd-release or a milter helper actually needs it.
$unix_socketname = env_str('UNIX_SOCKETNAME', undef);

## Alpine ships $enable_db disabled, and this package has no BerkeleyDB
## support. Keep it off. NANNY_DETAILS_LEVEL only affects the DB/SNMP nanny
## and is not exposed.
$enable_db = 0;

## Alpine enables DKIM verification and loads the signing code. Keep both
## enabled; signing only has an effect when keys are configured in the local
## config.
$enable_dkim_verification =
	env_bool('ENABLE_DKIM_VERIFICATION', $enable_dkim_verification);
$enable_dkim_signing =
	env_bool('ENABLE_DKIM_SIGNING', $enable_dkim_signing);

## MTA INTERFACE - INPUT

## Keep Alpine's port 10024 default; expose it for integration with the MTA.
$inet_socket_port = env_num('INET_SOCKET_PORT', $inet_socket_port);

## Alpine binds to loopback and accepts only localhost. In a container the
## MTA is normally another pod/container, so bind all interfaces by default;
## the pod network is the trust boundary. INET_SOCKET_BIND can narrow the bind
## address, but @inet_acl remains open in this layer.
$inet_socket_bind = env_str('INET_SOCKET_BIND', '*');
@inet_acl = qw( 0.0.0.0/0 );

## MTA INTERFACE - OUTPUT

## Alpine/upstream defaults $localhost_name to localhost. Keep the image's
## hostname-based default so HELO names are meaningful; override if the MTA
## expects a specific name.
$localhost_name = env_str('LOCALHOST_NAME', $myhostname);

## MAIL FORWARDING

## Alpine's forward/notify default is SMTP to 127.0.0.1:10025. Keep SMTP and
## make the MTA address configurable; POSTFIX_IP is the MTA host.
my $postfix_ip = env_str('POSTFIX_IP', '127.0.0.1');

$forward_method = "smtp:$postfix_ip:10025";
$notify_method  = "smtp:$postfix_ip:10025";

## Keep Alpine's final destinies: discard viruses and banned mail, pass spam
## and bad headers. These are policy choices, not container-specific.
$final_virus_destiny      = env_destiny('FINAL_VIRUS_DESTINY',      $final_virus_destiny);
$final_banned_destiny     = env_destiny('FINAL_BANNED_DESTINY',     $final_banned_destiny);
$final_spam_destiny       = env_destiny('FINAL_SPAM_DESTINY',       $final_spam_destiny);
$final_bad_header_destiny = env_destiny('FINAL_BAD_HEADER_DESTINY', $final_bad_header_destiny);

## NOTIFICATIONS (DSN, admin, recip)
##
## Alpine sends virus notifications to virusalert@$mydomain and uses
## virusalert/spam.police as envelope senders. This image disables admin
## notifications by default to avoid sending reports to example.com or
## addresses that may not exist. Set VIRUS_ADMIN and/or SPAM_ADMIN to enable
## them. MAILFROM_NOTIFY_* only changes the envelope sender; it does not
## enable notifications by itself.
my $virus_admin_addr = env_str('VIRUS_ADMIN', '');
my $spam_admin_addr  = env_str('SPAM_ADMIN',  '');

$virus_admin = $virus_admin_addr ne '' ? $virus_admin_addr : undef;
$spam_admin  = $spam_admin_addr  ne '' ? $spam_admin_addr  : undef;

$mailfrom_notify_admin =
	u($ENV{MAILFROM_NOTIFY_ADMIN}) // $virus_admin_addr;
$mailfrom_notify_recip =
	u($ENV{MAILFROM_NOTIFY_RECIP}) // $virus_admin_addr;
$mailfrom_notify_spamadmin =
	u($ENV{MAILFROM_NOTIFY_SPAMADMIN})
	// ($spam_admin_addr ne '' ? $spam_admin_addr : $virus_admin_addr);
## Alpine's quarantine return path is empty (null sender). Keep that unless
## MAILFROM_TO_QUARANTINE explicitly supplies an address.
$mailfrom_to_quarantine =
	u($ENV{MAILFROM_TO_QUARANTINE}) // $mailfrom_to_quarantine;

$policy_bank{'ORIGINATING'}{virus_admin_maps} =
	$virus_admin_addr ne '' ? [$virus_admin_addr] : [];
$policy_bank{'ORIGINATING'}{spam_admin_maps} =
	$spam_admin_addr ne '' ? [$spam_admin_addr] : [];

## MAIL DECODING

## There is no local virus scanner in this image. Drop the distribution's
## clamdscan/clamscan entries and use a remote clamd when CLAMAV_HOST is set.
## CLAMAV_PORT defaults to 3310; a host:port already present in CLAMAV_HOST is
## honored unless CLAMAV_PORT is also set.
@av_scanners = ();
@av_scanners_backup = ();

my $clamav_host = env_str('CLAMAV_HOST', '');

if ($clamav_host ne '') {
	my $clamav_port = env_port('CLAMAV_PORT', 3310);
	my $clamav_addr = $clamav_host;

	if (defined $ENV{CLAMAV_PORT} && $ENV{CLAMAV_PORT} ne '') {
		$clamav_addr =~ s/:\d+$//;
	}
	$clamav_addr .= ":$clamav_port" unless $clamav_addr =~ /:\d+$/;

	push(@av_scanners,

### http://www.clamav.net/
	['ClamAV-clamd',
		\&ask_daemon, ["*", u("clamd:$clamav_addr")],
		qr/\bOK$/m, qr/\bFOUND$/m,
		qr/^.*?: (?!Infected Archive)(.*) FOUND$/m ],
	);
}

## SPAMASSASSIN

## Keep Alpine's thresholds by default. Empty numeric values keep the Alpine
## value. An empty subject tag disables the tag.
$sa_spam_subject_tag  = u($ENV{SA_SPAM_SUBJECT_TAG})  // $sa_spam_subject_tag;
$sa_spam_subject_tag1 = u($ENV{SA_SPAM_SUBJECT_TAG1}) // $sa_spam_subject_tag1;

$sa_tag_level_deflt  = env_num('SA_TAG_LEVEL_DEFLT',  $sa_tag_level_deflt);
$sa_tag2_level_deflt = env_num('SA_TAG2_LEVEL_DEFLT', $sa_tag2_level_deflt);
$sa_tag3_level_deflt = env_num('SA_TAG3_LEVEL_DEFLT', $sa_tag3_level_deflt);
$sa_kill_level_deflt = env_num('SA_KILL_LEVEL_DEFLT', $sa_kill_level_deflt);

$sa_dsn_cutoff_level =
	env_num('SA_DSN_CUTOFF_LEVEL', $sa_dsn_cutoff_level);
$sa_crediblefrom_dsn_cutoff_level =
	env_num('SA_CREDIBLEFROM_DSN_CUTOFF_LEVEL',
		$sa_crediblefrom_dsn_cutoff_level);
$sa_quarantine_cutoff_level =
	env_num('SA_QUARANTINE_CUTOFF_LEVEL', $sa_quarantine_cutoff_level);

## Keep Alpine's penpals and bounce-killer defaults; these are useful tuning
## knobs for spam handling. PENPALS_THRESHOLD_HIGH follows the effective kill
## level unless set explicitly.
$penpals_bonus_score = env_num('PENPALS_BONUS_SCORE', $penpals_bonus_score);
$penpals_threshold_high =
	env_num('PENPALS_THRESHOLD_HIGH', $sa_kill_level_deflt);
$bounce_killer_score =
	env_num('BOUNCE_KILLER_SCORE', $bounce_killer_score);

$sa_mail_body_size_limit =
	env_num('SA_MAIL_BODY_SIZE_LIMIT', $sa_mail_body_size_limit);
$sa_local_tests_only =
	env_bool('SA_LOCAL_TESTS_ONLY', $sa_local_tests_only);

## Keep Alpine's resource limits; these are useful for container sizing.
$MAXLEVELS = env_num('MAX_LEVELS', $MAXLEVELS);
$MAXFILES  = env_num('MAX_FILES',  $MAXFILES);
$MIN_EXPANSION_QUOTA =
	env_num('MIN_EXPANSION_QUOTA', $MIN_EXPANSION_QUOTA);
$MAX_EXPANSION_QUOTA =
	env_num('MAX_EXPANSION_QUOTA', $MAX_EXPANSION_QUOTA);

## Keep Alpine's defanging defaults; they are safe for passed virus/banned
## mail and do not affect clean mail.
$defang_virus  = env_bool('DEFANG_VIRUS',  $defang_virus);
$defang_banned = env_bool('DEFANG_BANNED', $defang_banned);

## INTENTIONALLY NOT EXPOSED
##
## - $daemon_user, @daemon_groups: the image runs as amavis (UID/GID 3334);
##   no other mail-filter user or group is created.
## - $MYHOME, $TEMPBASE, $QUARANTINEDIR, $path: fixed by the image's volume
##   and executable layout. Override in amavisd-local.conf if that changes.
## - $do_syslog, $syslog_facility: no syslog socket; $do_syslog stays 0.
## - $enable_db, $nanny_details_level: Alpine does not support BerkeleyDB.
## - $log_recip_templ: per-recipient log template; not useful here.
## - @inet_acl, @mynetworks, @local_domains_maps, @score_sender_maps,
##   $banned_filename_re, policy banks, decoders: structural/security
##   settings; use amavisd-local.conf if needed. @av_scanners is reduced to
##   the remote clamd built from CLAMAV_HOST above.

1;  # ensure a defined return
